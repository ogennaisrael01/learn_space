version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - .env
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis_server
    restart: unless-stopped
    network_mode: "host"

  web:
    build: .
    container_name: learn-space-app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    volumes:
      - .:/app
    network_mode: "host"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build: .
    container_name: celery_worker
    command: ["celery", "-A", "learn_hub", "worker", "--loglevel=info"]
    restart: unless-stopped
    volumes:
      - .:/app
    network_mode: "host"
    env_file:
      - .env

  celery_beat:
    build: .
    container_name: celery_beat
    command: ["celery", "-A", "learn_hub", "beat", "--loglevel=info"]
    restart: unless-stopped
    volumes:
      - .:/app
    network_mode: "host"
    env_file:
      - .env

volumes:
  postgres_data:
