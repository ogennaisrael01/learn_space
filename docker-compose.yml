version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "5379:5379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  adminer:
    image: adminer:standalone
    container_name: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  web:
    build: .
    container_name: learn-space-app
    command: >
      sh -c "chmod +x ./entry_point && ./entry_point"
    restart: unless-stopped
    volumes:
      - .:/app

    depends_on:
      - redis
      - db
    
    ports:
      - "8000:8000"
    env_file:
      - .env
    

  celery_worker:
    build: .
    container_name: celery_worker
    command: ["celery", "-A", "learn_hub", "worker", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env

  celery_beat:
    build: .
    container_name: celery_beat
    command: ["celery", "-A", "learn_hub", "beat", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
